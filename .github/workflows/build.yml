name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure (macOS, universal)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release --parallel 4 --target UnterholzUH20_All UnterholzUH20_CLAP
      - name: Tests
        run: |
          cmake --build build --config Release --target uh20_tests uh20_tests_reference
          ctest --test-dir build -C Release --output-on-failure
      - name: Sanity suite (blocking, touch, aliasing, stability, knobs, sample rates)
        if: runner.os == 'macOS'
        run: |
          cmake --build build --config Release --target uh20_cli
          python3 -m pip install --quiet --break-system-packages numpy scipy soundfile
          python3 tools/amp_sanity.py tests/sanity/uh20.json --quick --cli build/uh20_cli --json sanity.json
      - name: Reference set (tone, loudness and aliasing against the reference engine's renders; touch and sweep)
        if: runner.os == 'macOS'
        run: |
          cmake --build build --config Release --target uh20_cli uh20_cli_ref
          python3 -m pip install --quiet --break-system-packages numpy scipy soundfile pyloudnorm
          python3 tools/reference_check.py --cli build/uh20_cli_ref --tight --no-sanity
          python3 tools/reference_check.py --cli build/uh20_cli --ref-cli build/uh20_cli_ref --quick
      - name: Sample files (format, channels, loudness, true peak, holes, length)
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 -m pip install --quiet --break-system-packages numpy scipy pyloudnorm
          python3 tools/check_samples.py docs
          cmake --build build --config Release --target uh20_cli
          python3 tools/render_samples.py --check-labels
      - name: Browser engine (the committed WebAssembly matches the source and the native renderer)
        if: runner.os == 'macOS'
        run: |
          tools/build_web.sh --check
          cmake --build build --config Release --target uh20_cli
          # the same renderer without fused multiply-add, which WebAssembly lacks: the strict check (see tools/web_parity.mjs)
          c++ -O3 -DNDEBUG -std=c++20 -ffp-contract=off tools/uh20_cli.cpp -o build/uh20_cli_nofma
          ffmpeg -loglevel error -y -i docs/play/recordings/the-puzzle-remains-lead.opus -t 30 -c:a pcm_f32le parity_in.wav
          node tools/web_parity.mjs --cli build/uh20_cli --wasm docs/play/uh20.wasm --in parity_in.wav
          node tools/web_parity.mjs --cli build/uh20_cli_nofma --wasm docs/play/uh20.wasm --in parity_in.wav --limit -140
      - name: Browser player's audio thread (knob changes reach the engine within 100 ms, even on a busy device)
        if: runner.os == 'macOS'
        run: node tools/worklet_test.mjs --wasm docs/play/uh20.wasm
      - uses: mymindstorm/setup-emsdk@v14
        if: runner.os == 'macOS'
        with:
          version: 7.0.1
      - name: Browser engine (a fresh build from the source matches the native renderer too)
        if: runner.os == 'macOS'
        run: |
          OUT=fresh.wasm tools/build_web.sh
          node tools/web_parity.mjs --cli build/uh20_cli_nofma --wasm fresh.wasm --in parity_in.wav --limit -140
          if cmp -s fresh.wasm docs/play/uh20.wasm; then echo "fresh build is byte-identical to docs/play/uh20.wasm"; else echo "fresh build differs in bytes from docs/play/uh20.wasm (another compiler build); both pass parity"; fi
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          A="build/UnterholzUH20_artefacts/Release"
          D="dist/Unterholz-UH-20-macOS"
          mkdir -p "$D"
          ditto "$A/VST3/Unterholz UH-20.vst3" "$D/VST3/Unterholz UH-20.vst3"
          ditto "$A/AU/Unterholz UH-20.component" "$D/AU/Unterholz UH-20.component"
          ditto "$A/CLAP/Unterholz UH-20.clap" "$D/CLAP/Unterholz UH-20.clap"
          ditto "$A/Standalone/Unterholz UH-20.app" "$D/Standalone/Unterholz UH-20.app"
          cp docs/INSTALL-macOS.txt "$D/INSTALL.txt"
          cd dist && ditto -c -k --keepParent Unterholz-UH-20-macOS Unterholz-UH-20-macOS.zip && cd ..
          # installer package (used by the Homebrew cask): the same bundles in the system-wide plug-in folders
          R="pkgroot"
          mkdir -p "$R/Library/Audio/Plug-Ins/VST3" "$R/Library/Audio/Plug-Ins/Components" "$R/Library/Audio/Plug-Ins/CLAP" "$R/Applications"
          ditto "$A/VST3/Unterholz UH-20.vst3" "$R/Library/Audio/Plug-Ins/VST3/Unterholz UH-20.vst3"
          ditto "$A/AU/Unterholz UH-20.component" "$R/Library/Audio/Plug-Ins/Components/Unterholz UH-20.component"
          ditto "$A/CLAP/Unterholz UH-20.clap" "$R/Library/Audio/Plug-Ins/CLAP/Unterholz UH-20.clap"
          ditto "$A/Standalone/Unterholz UH-20.app" "$R/Applications/Unterholz UH-20.app"
          for b in "$R"/Library/Audio/Plug-Ins/*/"Unterholz UH-20".* "$R/Applications/Unterholz UH-20.app"; do codesign --force --deep -s - "$b"; done
          V="${GITHUB_REF_NAME#v}"; case "$V" in [0-9]*) ;; *) V="0.0.0";; esac
          pkgbuild --root "$R" --install-location / --identifier com.unterholz.uh20.pkg --version "$V" dist/Unterholz-UH-20.pkg
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $A = "build/UnterholzUH20_artefacts/Release"
          $D = "dist/Unterholz-UH-20-Windows"
          New-Item -ItemType Directory -Force -Path "$D/VST3","$D/CLAP","$D/Standalone" | Out-Null
          Copy-Item -Recurse "$A/VST3/Unterholz UH-20.vst3" "$D/VST3/"
          Copy-Item "$A/CLAP/Unterholz UH-20.clap" "$D/CLAP/"
          Copy-Item "$A/Standalone/Unterholz UH-20.exe" "$D/Standalone/"
          Copy-Item docs/INSTALL-Windows.txt "$D/INSTALL.txt"
          Compress-Archive -Path $D -DestinationPath dist/Unterholz-UH-20-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Unterholz-UH-20-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.pkg
          generate_release_notes: true
